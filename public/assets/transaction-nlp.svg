<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080C10"/>
      <stop offset="1" stop-color="#0F1A22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A4C59"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00D4FF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- raw descriptors -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="17" fill="#8FA3B4">
    <rect x="70" y="120" width="430" height="52" rx="6" fill="#111A21" stroke="#1E2A33" stroke-width="2"/>
    <text x="90" y="153">SQ *BLUE BOTTLE COFFEE 4471</text>
    <rect x="70" y="200" width="430" height="52" rx="6" fill="#111A21" stroke="#1E2A33" stroke-width="2"/>
    <text x="90" y="233">AMZN MKTP US*2K4L9X1</text>
    <rect x="70" y="280" width="430" height="52" rx="6" fill="#111A21" stroke="#1E2A33" stroke-width="2"/>
    <text x="90" y="313">XQZ HOLDINGS 99</text>
  </g>

  <!-- arrows -->
  <g stroke="#3A4C59" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="510" y1="146" x2="700" y2="146"/>
    <line x1="510" y1="226" x2="700" y2="226"/>
  </g>
  <line x1="510" y1="306" x2="700" y2="306" stroke="#00D4FF" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>

  <!-- results -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="17">
    <rect x="712" y="120" width="420" height="52" rx="6" fill="#1E2A33"/>
    <text x="732" y="153" fill="#E8EEF3">Blue Bottle Coffee</text>
    <text x="1112" y="153" fill="#8FA3B4" text-anchor="end">Dining</text>
    <rect x="712" y="200" width="420" height="52" rx="6" fill="#1E2A33"/>
    <text x="732" y="233" fill="#E8EEF3">Amazon</text>
    <text x="1112" y="233" fill="#8FA3B4" text-anchor="end">Shopping</text>
    <rect x="712" y="280" width="420" height="52" rx="6" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <text x="732" y="313" fill="#00D4FF">needs_review</text>
    <text x="1112" y="313" fill="#8FA3B4" text-anchor="end">conf 0.30</text>
  </g>

  <text x="600" y="540" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="1" fill="#E8EEF3">transaction-nlp</text>
  <text x="600" y="584" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3B4">Card-statement lines to merchants and spend categories, with human review.</text>
</svg>

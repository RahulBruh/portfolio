<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080C10"/>
      <stop offset="1" stop-color="#0F1A22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono', Consolas, monospace">
    <!-- axis -->
    <line x1="250" y1="420" x2="950" y2="420" stroke="#1E2A33" stroke-width="2"/>
    <!-- tokens per task bars: 26,468 / 10,154 / 13,252 / 7,400 (scale 260px = 26,468) -->
    <rect x="290" y="160" width="110" height="260" fill="#1E2A33"/>
    <rect x="450" y="320" width="110" height="100" fill="#1E2A33"/>
    <rect x="610" y="290" width="110" height="130" fill="#1E2A33"/>
    <rect x="770" y="347" width="110" height="73" fill="#00D4FF"/>
    <g font-size="18" text-anchor="middle" fill="#8FA3B4">
      <text x="345" y="148">26,468</text>
      <text x="505" y="308">10,154</text>
      <text x="665" y="278">13,252</text>
      <text x="825" y="335" fill="#00D4FF">7,400</text>
    </g>
    <g font-size="15" text-anchor="middle" fill="#6B7585">
      <text x="345" y="448">v1 inline</text>
      <text x="505" y="448">v1 progressive</text>
      <text x="665" y="448">v2 inline</text>
      <text x="825" y="448" fill="#00D4FF">v2 progressive</text>
    </g>
    <text x="950" y="200" text-anchor="end" font-size="40" font-weight="700" fill="#00D4FF">−72%</text>
    <text x="950" y="230" text-anchor="end" font-size="16" fill="#8FA3B4">tokens / task</text>
  </g>
  <text x="600" y="540" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="1" fill="#E8EEF3">agent-eval-harness</text>
  <text x="600" y="584" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8FA3B4">Accuracy, tokens, cost and latency per agent config, with a CI gate.</text>
</svg>
